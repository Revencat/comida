<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Brócoli sonriente" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Brócoli sonriente</title>
  <rect width="200" height="200" rx="44" fill="#FFE59A"/>
  <g transform="translate(20 14) scale(0.8)">

  <!-- sombra -->
  <ellipse cx="100" cy="190" rx="42" ry="5" fill="#1F5130" opacity="0.12"/>

  <!-- contorno unificado (se dibuja primero, con trazo grueso) -->
  <g fill="#1F5130" stroke="#1F5130" stroke-width="10" stroke-linejoin="round">
    <rect x="74" y="112" width="52" height="68" rx="22"/>
    <circle cx="52" cy="92" r="28"/>
    <circle cx="78" cy="60" r="32"/>
    <circle cx="122" cy="58" r="34"/>
    <circle cx="150" cy="90" r="28"/>
    <circle cx="100" cy="88" r="42"/>
  </g>

  <!-- tallo -->
  <rect x="74" y="112" width="52" height="68" rx="22" fill="#B7DB7A"/>
  <path d="M89 150v13M111 150v13" stroke="#8FBF4F" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- copa de floretes -->
  <g fill="#3FA34D">
    <circle cx="52" cy="92" r="28"/>
    <circle cx="78" cy="60" r="32"/>
    <circle cx="122" cy="58" r="34"/>
    <circle cx="150" cy="90" r="28"/>
    <circle cx="100" cy="88" r="42"/>
  </g>

  <!-- brillos -->
  <g fill="#8FD16E" opacity="0.85">
    <circle cx="66" cy="46" r="7"/>
    <circle cx="110" cy="40" r="8"/>
    <circle cx="38" cy="82" r="6"/>
    <circle cx="150" cy="76" r="6"/>
  </g>

  <!-- ojos -->
  <g>
    <circle cx="82" cy="96" r="12" fill="#FFFFFF" stroke="#1F5130" stroke-width="3"/>
    <circle cx="118" cy="96" r="12" fill="#FFFFFF" stroke="#1F5130" stroke-width="3"/>
    <circle cx="85" cy="98" r="6.5" fill="#1D2B20"/>
    <circle cx="121" cy="98" r="6.5" fill="#1D2B20"/>
    <circle cx="87.5" cy="95.5" r="2.4" fill="#FFFFFF"/>
    <circle cx="123.5" cy="95.5" r="2.4" fill="#FFFFFF"/>
  </g>

  <!-- mejillas y sonrisa -->
  <ellipse cx="68" cy="111" rx="7" ry="5" fill="#FF8FA3" opacity="0.75"/>
  <ellipse cx="132" cy="111" rx="7" ry="5" fill="#FF8FA3" opacity="0.75"/>
  <path d="M89 113Q100 125 111 113" fill="none" stroke="#1F5130" stroke-width="4.5" stroke-linecap="round"/>
</g>
</svg>
